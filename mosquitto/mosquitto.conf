# Mosquitto 2.x refuses non-loopback clients and anonymous logins unless told
# otherwise. Without an explicit listener + allow_anonymous, the ESP32 gets
# "Connection Refused: not authorised" and never receives zone commands.
listener 1883 0.0.0.0
allow_anonymous true

# The ESP32 publishes zone status with retain=true. Persisting retained
# messages means the app still sees last-known zone state after a broker
# restart instead of every zone reading blank.
persistence true
persistence_location /mosquitto/data/
